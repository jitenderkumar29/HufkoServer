spring:
  application:
    name: HufkoServer

  data:
    mongodb:
      host: localhost
      port: 27017
      database: hufko_db
      auto-index-creation: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

app:
  jwt:
    secret: mySecretKeyForJWTTokenGeneration2025!@#$%^&*ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890
    expiration-in-ms: 86400000

server:
  port: 8085

logging:
  level:
    com.hufko: DEBUG
    org.springframework.data.mongodb: INFO