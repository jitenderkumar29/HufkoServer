spring.application.name=HufkoServer

# ==========================
# MongoDB
# ==========================
spring.data.mongodb.uri=mongodb://localhost:27017/hufko_db

# ==========================
# JWT
# ==========================
app.jwt.secret=mySecretKeyForJWTTokenGeneration2025!@#$%^&*ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890
app.jwt.expiration-in-ms=86400000

# ==========================
# File Upload
# ==========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==========================
# Server
# ==========================
server.address=0.0.0.0
server.port=8085

# ==========================
# Logging
# ==========================
logging.level.com.hufko=DEBUG
logging.level.org.springframework.data.mongodb=INFO