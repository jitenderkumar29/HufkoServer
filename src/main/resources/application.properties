spring.application.name=HufkoServer

# MongoDB URI - Most reliable format
spring.data.mongodb.uri=mongodb://localhost:27017/hufko_db

# JWT Configuration
app.jwt.secret=mySecretKeyForJWTTokenGeneration2025!@#$%^&*ABCDEFGHIJKLMNOPQRSTUVWXYZ1234567890
app.jwt.expiration-in-ms=86400000

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Configuration
server.port=8085

# Logging
logging.level.org.springframework.data.mongodb=DEBUG